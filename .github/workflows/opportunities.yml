name: IPPSEF - actualisation des opportunites
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ippsef-opportunities
  cancel-in-progress: false
jobs:
  collect:
    # Standard hosted runners are free for public repositories.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify collector behavior
        run: python -m unittest discover -s tests
      - name: Collect public metadata
        id: collect
        continue-on-error: true
        env:
          IPPSEF_AUTOMATION_ACTIVE: 'true'
        run: python scripts/collect_opportunities.py
      - name: Save updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser les opportunites professionnelles IPPSEF'
            git push
          fi
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Aucune source actualisee. Consulter les statuts dans data/opportunities.json.'
          exit 1
